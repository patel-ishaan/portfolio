<section class="contact" id="contact" aria-labelledby="contact-title">
  <img
    class="contact__bg"
    src="images/studio-portrait.jpg"
    alt="Ishaan Patel seated in a studio in front of a hand-painted mural."
    width="2000"
    height="1125"
    loading="lazy"
  />
  <div class="contact__veil" aria-hidden="true"></div>

  <div class="contact__card">
    <h2 class="contact__title" id="contact-title">Let’s build it.</h2>
    <p class="contact__lead">Open to AI engineering roles and freelance product builds.</p>

    <dl class="contact__details">
      <div>
        <dt>Email</dt>
        <dd><a [href]="'mailto:' + email">{{ email }}</a></dd>
      </div>
      <div>
        <dt>Phone</dt>
        <dd><a [href]="'tel:' + phoneHref">{{ phone }}</a></dd>
      </div>
      <div>
        <dt>LinkedIn</dt>
        <dd><a [href]="linkedin" target="_blank" rel="noopener">patelishaan2529</a></dd>
      </div>
      <div>
        <dt>GitHub</dt>
        <dd><a [href]="github" target="_blank" rel="noopener">patelishaan</a></dd>
      </div>
    </dl>

    <div class="contact__actions">
      <a class="btn contact__cta" [href]="mailto">Email Ishaan</a>
      <a class="text-link" [href]="resume" download>Résumé <span aria-hidden="true">↓</span></a>
    </div>

    <p class="contact__note small">Based in India. Available for a conversation.</p>
  </div>

  <p class="contact__credit small">Photo: Ishaan Patel, 2026.</p>
</section>
